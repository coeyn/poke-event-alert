name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: poke_event_alert_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poke_event_alert_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poke_event_alert_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck API
        run: npm run --workspace @poke-event-alert/api typecheck

      - name: Unit tests
        run: npm run --workspace @poke-event-alert/api test

      - name: Apply database migrations
        run: npm run --workspace @poke-event-alert/api db:migrate

      - name: Integration tests
        run: npm run --workspace @poke-event-alert/api test:integration

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck web
        run: npm run --workspace @poke-event-alert/web typecheck

      - name: Generate preview event data
        run: npm run --workspace @poke-event-alert/web preview:data

      - name: Build static preview
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/poke-event-alert"
        run: npm run --workspace @poke-event-alert/web build
