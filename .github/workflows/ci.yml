name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck API
        run: npm run --workspace @poke-event-alert/api typecheck

      - name: Test API
        run: npm run --workspace @poke-event-alert/api test

      - name: Live PokéData smoke test
        if: github.ref == 'refs/heads/feat/database-ingestion'
        continue-on-error: true
        run: npm run --workspace @poke-event-alert/api source:pokedata
