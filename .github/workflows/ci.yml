name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck API
        run: npm run --workspace @poke-event-alert/api typecheck

      - name: Test API
        run: npm run --workspace @poke-event-alert/api test
